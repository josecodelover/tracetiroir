[package]
name = "tracetiroir"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
earcutr = "0.5.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "links", "system_fonts"] }
image = "0.25.10"
imageproc = "0.27.0"
rfd = "0.18.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

# Exécutable plus léger : optimisation globale, sans symboles de débogage.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
